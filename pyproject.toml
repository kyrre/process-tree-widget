[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "process_tree_widget"
version = "0.1.0"
description = "Interactive process tree visualization widget for security and forensics analysis in marimo notebooks"
requires-python = ">=3.12"
authors = [
    { name = "Kyrre Wahl Kongsgård" }
]
license = { text = "MIT" }
dependencies = [
    "anywidget",
    "treelib",
    "pydantic",
    "narwhals",
    "traitlets",
]
readme = "README.md"

[dependency-groups]
dev = [
    "watchfiles",
    "ruff",
    "mypy",
    "marimo",
    "ibis-framework[duckdb,deltalake]",
    "pytest>=9.0.3",
]

[tool.hatch.build]
only-packages = true
artifacts = ["src/process_tree_widget/static/*"]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/process_tree_widget/static/process-tree/widget.js"]
skip-if-exists = ["src/process_tree_widget/static/process-tree/widget.js"]
dependencies = ["hatch-jupyter-builder>=0.5.0"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "npm"
build_cmd = "build"

[tool.ruff]
exclude = [
    "notebooks/",
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["notebooks/"]
